<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammatik Kanpeki</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23234'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>G</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved theme before the first paint (the app keeps it in sync afterwards).
    try { const t = JSON.parse(localStorage.getItem('gk.settings.v1') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-lang="de">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="btn-menu" data-action="toggle-menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" id="brand" href="#/de/nominalisierung/learn">Grammatik <span>Kanpeki</span></a>
    <div class="lang-menu">
      <button type="button" class="lang-btn" id="lang-btn" data-action="toggle-lang" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-list"></button>
      <div class="lang-list" id="lang-list" role="menu" hidden></div>
    </div>
    <div class="top-actions">
      <button class="btn ghost small data-btn" id="btn-data" data-action="open-data">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 4v13M3 13l4 4 4-4M17 20V7M13 11l4-4 4 4"/></svg>
        <span class="btn-label">Import / Export</span>
      </button>
      <button class="icon-btn" id="btn-settings" data-action="open-settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" data-action="close-menu" hidden></div>
    <div class="content">
      <div class="content-head" id="content-head"></div>
      <main id="view"></main>
    </div>
  </div>
  <div id="word-pop" class="word-pop" role="dialog" aria-label="單字" hidden></div>
  <dialog id="dlg-data"></dialog>
  <dialog id="dlg-settings"></dialog>
  <dialog id="dlg-card" class="dlg-wide"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
